<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Cloud-Native Motivation</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: Arial, sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background: linear-gradient(
        135deg,
        #dbeafe,
        #e0e7ff,
        #f5f3ff
    );
}

.container{
    width:350px;
    background:rgba(255,255,255,0.7);
    padding:35px;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,0.06);
    backdrop-filter: blur(10px);
}

h1{
    text-align:center;
    margin-bottom:8px;
    color:#111827;
    font-size:26px;
    letter-spacing: -0.5px;
}

.subtitle{
    text-align:center;
    color:#6b7280;
    margin-bottom:25px;
    font-size:14px;
    line-height:1.5;
}

label{
    font-size:15px;
    color:#374151;
    font-weight:600;
}

select{
    width:100%;
    padding:12px;
    margin-top:10px;
    border-radius:10px;
    border:1px solid #d1d5db;
    background:#f9fafb;
    font-size:15px;
    outline:none;
}

button{
    width:100%;
    margin-top:18px;
    padding:12px;
    border:none;
    border-radius:10px;
    background:#111827;
    color:white;
    font-size:15px;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:#1f2937;
}

.result{
    margin-top:22px;
    background:#f9fafb;
    border-radius:12px;
    padding:18px;
    min-height:90px;
    color:#374151;
    line-height:1.6;
    border:1px solid #e5e7eb;
}

.mood-name{
    font-weight:bold;
    color:#111827;
}
</style>
</head>

<body>

<div class="container">

    <h1>Cloud-Native Motivation</h1>

    <p class="subtitle">
        Select your current mood to trigger a serverless microservice call.
    </p>

    <label>Select Mood</label>

    <select id="mood">
        <option value="">Choose your mood</option>
        <option value="happy">Happy</option>
        <option value="sad">Sad</option>
        <option value="stressed">Stressed</option>
        <option value="tired">Tired</option>
    </select>

    <button onclick="showMessage()">Get Motivation</button>

    <div class="result" id="result">
        Your cloud-generated response will appear here.
    </div>

</div>

<script>
async function showMessage(){
    let mood = document.getElementById("mood").value;
    let result = document.getElementById("result");

    if(mood === ""){
        result.innerHTML = "Please select a mood first.";
        return;
    }

    result.innerHTML = "Fetching motivation from serverless edge...";

    try {
        const response = await fetch(`/.netlify/functions/get-motivation?mood=${mood}`);
        
        if (!response.ok) {
            throw new Error("Serverless function error");
        }
        
        const data = await response.json();

        result.innerHTML = `
            <span class="mood-name">Mood: ${data.mood.charAt(0).toUpperCase() + data.mood.slice(1)}</span>
            <br><br>
            ${data.quote}
        `;

    } catch (error) {
        console.error("Error:", error);
        result.innerHTML = "Cloud edge timeout. Ensure the project is deployed on Netlify.";
    }
}
</script>

</body>
</html>
